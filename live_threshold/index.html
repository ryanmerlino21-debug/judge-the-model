<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font-family: Inter, -apple-system, 'Segoe UI', sans-serif; color: #111; background: transparent; font-size: 14px; }
  .top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .top label { font-size: 14px; }
  #val { font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; color: #1F7A8C; line-height: 1; }
  input[type=range] { width: 100%; accent-color: #1F7A8C; height: 28px; cursor: pointer; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: -4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  .cap { font-size: 12px; color: #666; margin: 0 0 4px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; border: 1px solid rgba(17,17,17,.2); border-radius: 12px; overflow: hidden; }
  th { background: #EDE8DF; font-weight: 600; font-size: 12px; text-align: left; }
  td, th { padding: 8px 10px; border-bottom: 1px solid rgba(17,17,17,.1); border-right: 1px solid rgba(17,17,17,.1); }
  tr:last-child td { border-bottom: none; } td:last-child, th:last-child { border-right: none; }
  td.good { background: rgba(31,122,140,.25); } td.bad { background: rgba(232,104,58,.30); }
  td.name { background: #EDE8DF; font-weight: 600; font-size: 12px; color: #444; }
  .sum { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #E3EFE5; color: #1d5b2b; }
  .tgt { margin-top: 8px; font-size: 12px; color: #555; }
</style></head>
<body>
<div class="top"><label for="s" id="lab"></label><span id="val"></span></div>
<input type="range" id="s" min="1" max="99" step="1" value="50">
<div class="scale"><span>0.01</span><span>0.99</span></div>
<div class="grid">
  <div><p class="cap" id="capL"></p><div id="mL"></div></div>
  <div><p class="cap" id="capR"></p><div id="mR"></div></div>
</div>
<p class="cap" id="capT" style="margin-top:14px"></p>
<div id="cmp"></div>
<div class="sum" id="sum"></div>
<div class="tgt" id="tgt"></div>
<script>
const slider = document.getElementById("s");
let A = null, nonce = null, timer = null;
function post(type, extra) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*"); }
function matrix(c, a) {
  const cell = (k, t, cls) => '<td class="' + cls + '">' + t + ' = ' + c[k] + '</td>';
  return '<table><tr><th></th><th>' + a.col1 + '</th><th>' + a.col2 + '</th></tr>' +
    '<tr><td class="name">' + a.row1 + '</td>' + cell("tp", "TP", "good") + cell("fn", "FN", "bad") + '</tr>' +
    '<tr><td class="name">' + a.row2 + '</td>' + cell("fp", "FP", "bad") + cell("tn", "TN", "good") + '</tr></table>';
}
function draw() {
  if (!A) return;
  const v = slider.value, row = A.rows[v];
  document.getElementById("lab").textContent = A.labels.slider;
  document.getElementById("val").textContent = row.t;
  document.getElementById("capL").textContent = A.labels.capRef;
  document.getElementById("capR").textContent = A.labels.capNew.replace("{t}", row.t);
  document.getElementById("mL").innerHTML = matrix(A.ref, A.labels);
  document.getElementById("mR").innerHTML = matrix(row.c, A.labels);
  document.getElementById("capT").textContent = A.labels.capTable;
  let h = '<table><tr><th>Metric</th><th>Threshold 0.50</th><th>Threshold ' + row.t + ' (slider)</th><th>Change</th></tr>';
  row.cmp.forEach(r => { h += '<tr><td class="name">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; });
  document.getElementById("cmp").innerHTML = h + '</table>';
  document.getElementById("sum").innerHTML = row.summary;
  document.getElementById("tgt").textContent = row.target;
  post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 });
}
slider.addEventListener("input", () => {
  draw();
  clearTimeout(timer);
  timer = setTimeout(() => post("streamlit:setComponentValue", { value: { thr: A.rows[slider.value].tv, nonce: nonce }, dataType: "json" }), 200);
});
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  A = e.data.args;
  if (nonce !== A.nonce) { nonce = A.nonce; slider.value = Math.round(A.initial * 100); }
  draw();
});
post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body></html>
